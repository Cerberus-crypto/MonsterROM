name: Import prebuilts

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-prebuilts
  cancel-in-progress: false

jobs:
  import-targets:
    name: Import prebuilts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sixteenQPR2 branch
        uses: actions/checkout@v4
        with:
          ref: sixteenQPR2
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Clone source repository
        run: |
          git clone \
            --depth=1 \
            --branch sixteen \
            https://github.com/Devandroid-bit/DevandroidROM.git \
            source-repo

      - name: Import prebuilts
        run: |
          set -e

          SOURCE_DIR="source-repo/prebuilts/samsung/p3sxxx"
          DEST_DIR="prebuilts/samsung/p3sxxx"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "::error::Source directory does not exist: $SOURCE_DIR"
            exit 1
          fi

          echo "Removing existing prebuilts/samsung/p3sxxx..."
          rm -rf "$DEST_DIR"

          echo "Creating destination directory..."
          mkdir -p "$DEST_DIR"

          echo "Copying prebuilts/samsung/p3sxxx..."
          rsync -a --delete "$SOURCE_DIR/" "$DEST_DIR/"

          echo "prebuilts/samsung/p3sxxx imported successfully."

      - name: Check imported files
        run: |
          echo "Target files:"
          find target -type f | wc -l

          echo "prebuilts/samsung/p3sxxx files:"
          find prebuilts/samsung/p3sxxx -type f | wc -l

      - name: Check for changes
        id: changes
        run: |
          git add -A prebuilts/samsung/p3sxxx

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
          fi

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git commit \
            -m "init prebuilts p3sxxx"

      - name: Rebase sixteenQPR2
        if: steps.changes.outputs.changed == 'true'
        run: |
          git fetch origin sixteenQPR2

          git rebase origin/sixteenQPR2

      - name: Push changes to sixteenQPR2
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push --force-with-lease origin HEAD:sixteenQPR2

      - name: Cleanup
        if: always()
        run: |
          rm -rf source-repo
